<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <g>
    <!-- Тінь під скринькою -->
    <ellipse cx="256" cy="440" rx="200" ry="25" fill="#000000" opacity="0.3" />

    <!-- Основний корпус скриньки -->
    <path d="M 96 220 L 416 220 L 416 410 C 416 426, 402 440, 386 440 L 126 440 C 110 440, 96 426, 96 410 Z" fill="#8c5830" stroke="#3b2211" stroke-width="8" stroke-linejoin="round" />

    <!-- Горизонтальні металеві смуги (обшивка) -->
    <rect x="96" y="270" width="320" height="24" fill="#525252" stroke="#3b2211" stroke-width="6" />
    <rect x="96" y="360" width="320" height="24" fill="#525252" stroke="#3b2211" stroke-width="6" />

    <!-- Закруглена кришка скриньки -->
    <path d="M 96 220 C 96 140, 416 140, 416 220 Z" fill="#a66b3c" stroke="#3b2211" stroke-width="8" stroke-linejoin="round" />
    
    <!-- Металева окантовка кришки -->
    <path d="M 96 220 C 96 140, 416 140, 416 220 L 416 232 C 416 156, 96 156, 96 232 Z" fill="#6e6e6e" stroke="#3b2211" stroke-width="6" />

    <!-- Замок по центру -->
    <g transform="translate(236, 210)">
      <rect x="-20" y="-10" width="40" height="50" rx="6" fill="#d1a13d" stroke="#3b2211" stroke-width="6" />
      <circle cx="0" cy="15" r="8" fill="#3b2211" />
    </g>

    <!-- Заклєпки / болти на металевих смугах -->
    <circle cx="130" cy="282" r="6" fill="#3b2211" />
    <circle cx="382" cy="282" r="6" fill="#3b2211" />
    <circle cx="130" cy="372" r="6" fill="#3b2211" />
    <circle cx="382" cy="372" r="6" fill="#3b2211" />
  </g>
</svg>