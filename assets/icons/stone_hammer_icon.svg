  <!-- Верхня світла грань (блік/об'єм) -->
  <polygon points="26,24 44,8 48,12 30,28" fill="#A1ABAA"/>
  
  <!-- Бокова скошена частина (ударна поверхня) -->
  <polygon points="44,8 56,20 52,24 40,12" fill="#5A6260"/>
  
  <!-- Тріщини та сколи на камені -->
  <path d="M 38 18 L 42 24 L 36 28" fill="none" stroke="#2D3332" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
