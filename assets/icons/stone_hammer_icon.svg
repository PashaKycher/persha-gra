<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="16" height="16">
  <!-- Дерев'яна рукоятка -->
  <path d="M 16 52 L 36 28 L 42 34 L 22 58 Z" fill="#6E4723" stroke="#3B230D" stroke-width="2" stroke-linejoin="round"/>
  
  <!-- Обмотка мотузкою під обухом -->
  <path d="M 32 33 L 38 39 M 34 30 L 40 36" stroke="#C2A649" stroke-width="3" stroke-linecap="round"/>

  <!-- Основна кам'яна голова молота -->
